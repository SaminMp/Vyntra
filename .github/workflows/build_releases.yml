name: Build Multi-Platform Releases (Windows & macOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. BUILD WINDOWS STANDALONE EXECUTABLE (.exe)
  # ============================================================================


  
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
          choco install ffmpeg --no-progress

      - name: Synchronize Application Release Version
        run: |
          python scripts/get_release_version.py

      - name: Run Test Suite
        timeout-minutes: 5
        run: |
          pytest -v

      - name: Generate Application Icons
        run: |
          python scripts/generate_icons.py

      - name: Build Standalone Executable with PyInstaller
        run: |
          python -m PyInstaller --clean --noconfirm Vyntra.spec

      - name: Sign Windows Binary (if code signing certificate configured)
        if: env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          [System.IO.File]::WriteAllBytes("cert.pfx", $certBytes)
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist/Vyntra.exe
          Remove-Item cert.pfx

      - name: Stage Windows Release Assets
        shell: pwsh
        run: |
          Copy-Item dist/Vyntra.exe dist/Vyntra-Windows-x64.exe
          Compress-Archive -Path dist/Vyntra.exe -DestinationPath dist/Vyntra-Windows-x64.zip
          (Get-FileHash dist/Vyntra-Windows-x64.exe -Algorithm SHA256).Hash.ToLower() + "  Vyntra-Windows-x64.exe" | Out-File -Encoding ascii dist/Vyntra-Windows-x64.exe.sha256

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/Vyntra-Windows-x64.exe
            dist/Vyntra-Windows-x64.zip
            dist/Vyntra-Windows-x64.exe.sha256
          if-no-files-found: error

  # ============================================================================
  # 2. BUILD MACOS APPLICATION BUNDLE & DMG (.app / .dmg)
  # ============================================================================
  build-macos:
    name: Build macOS (.app & .dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Synchronize Application Release Version
        run: |
          python3 scripts/get_release_version.py

      - name: Run Test Suite
        timeout-minutes: 5
        run: |
          pytest -v

      - name: Generate Application Icons (.png, .icns)
        run: |
          python3 scripts/generate_icons.py

      - name: Build macOS Application Bundle with PyInstaller
        run: |
          python3 -m PyInstaller --clean --noconfirm Vyntra.spec

      - name: Sign macOS Application Bundle (if Developer ID configured)
        if: env.APPLE_CERT_BASE64 != ''
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "Decoding Apple Developer ID certificate..."
          echo "$APPLE_CERT_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          codesign --deep --force --options runtime --sign "Developer ID Application" dist/Vyntra.app
          rm certificate.p12

      - name: Create DMG Disk Image
        run: |
          mkdir -p dist/dmg_staging
          cp -R dist/Vyntra.app dist/dmg_staging/
          ln -s /Applications dist/dmg_staging/Applications
          hdiutil create \
            -volname "Vyntra" \
            -srcfolder dist/dmg_staging \
            -ov \
            -format UDZO \
            dist/Vyntra-macOS.dmg
          rm -rf dist/dmg_staging
          shasum -a 256 dist/Vyntra-macOS.dmg > dist/Vyntra-macOS.dmg.sha256

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            dist/Vyntra-macOS.dmg
            dist/Vyntra-macOS.dmg.sha256
          if-no-files-found: error

  # ============================================================================
  # 3. PUBLISH GITHUB RELEASE (Triggered on main branch or v* git tags)
  # ============================================================================
  publish-release:
    name: Publish Official GitHub Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine Release Tag & Version
        id: release_info
        run: |
          python scripts/get_release_version.py

      - name: Download All Built Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: Compute Unified SHA256SUMS.txt
        working-directory: release_assets
        run: |
          ls -la
          sha256sum Vyntra-Windows-x64.exe Vyntra-macOS.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          files: |
            release_assets/Vyntra-Windows-x64.exe
            release_assets/Vyntra-Windows-x64.zip
            release_assets/Vyntra-macOS.dmg
            release_assets/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

